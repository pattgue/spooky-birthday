<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d232c">
  <title>Spooky Birthday</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="scene" id="scene" data-state="closed">
    <!-- Tres capas reales del sobre: reverso, solapa y pliegues delanteros. -->
    <div class="envelope envelope--back" aria-hidden="true"><div class="envelope__body"></div></div>
    <div class="envelope envelope--flap" aria-hidden="true"><span class="envelope__flap"></span></div>
    <!-- La postal empieza dentro del bolsillo y sale a su tamaño original. -->
    <button class="card" id="card" type="button" aria-label="Dar la vuelta a la postal" tabindex="-1" aria-hidden="true">
      <span class="card__inner">
        <span class="card__face"><img src="./assets/anverso.svg" alt="" draggable="false"></span>
        <span class="card__face card__face--back"><img src="./assets/reverso.svg" alt="" draggable="false"></span>
      </span>
    </button>
    <button class="envelope envelope--front" id="envelope" type="button" aria-label="Abrir el sobre">
      <svg class="envelope__pocket" aria-hidden="true" viewBox="0 0 420 276" preserveAspectRatio="none">
        <path d="M 0,0 210,145 0,276 Z" fill="#c36a00" />
        <path d="M 420,0 210,145 420,276 Z" fill="#c36a00" />
        <path d="M 0,276 210,139 420,276 Z" fill="#c86b00" />
        <path d="M 0,0 210,145 420,0 M 0,276 210,139 420,276" fill="none" stroke="#a95c08" stroke-width="1.4" stroke-linejoin="round" />
      </svg>
    </button>
  </main>
</body>
</html>
